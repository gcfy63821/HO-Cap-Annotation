<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验浏览器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#111;color:#ddd;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* header */
header{background:#1a1a2e;padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333;flex-shrink:0}
header h1{font-size:15px;color:#7eb8f7;white-space:nowrap}
.hdr-sep{color:#444}
#filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select,input[type=text]{background:#222;color:#ddd;border:1px solid #444;padding:3px 8px;font-size:12px;border-radius:4px;outline:none}
select:focus,input:focus{border-color:#5a8fc0}
label{font-size:12px;color:#888}

/* main layout */
#main{display:flex;flex:1;overflow:hidden}

/* group panel */
#group-panel{width:200px;border-right:1px solid #2a2a40;display:flex;flex-direction:column;flex-shrink:0;background:#161622}
#group-search{padding:6px 8px;border-bottom:1px solid #222;background:#141420}
#group-search input{width:100%;background:#1e1e2e;border:1px solid #333;color:#ddd;padding:4px 8px;font-size:11px;border-radius:4px}
#group-list{flex:1;overflow-y:auto;padding:4px}
.group-row{padding:6px 8px;border-radius:5px;cursor:pointer;margin-bottom:2px;border-left:3px solid transparent;transition:background .1s}
.group-row:hover{background:#1e1e30}
.group-row.active{background:#1a2a3a;border-left-color:#4a7fc1}
.group-name{font-size:12px;color:#c8d8f0;font-weight:500;word-break:break-all}
.group-meta{font-size:10px;color:#666;margin-top:2px;display:flex;gap:6px}
.g-total{color:#888}.g-sub{color:#5dba7d}.g-lock{color:#d4a017}.g-none{color:#666}

/* exp panel */
#exp-panel{width:290px;border-right:1px solid #2a2a40;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#exp-header{padding:7px 10px;background:#151520;border-bottom:1px solid #222;font-size:12px;color:#888;display:flex;align-items:center;gap:6px;flex-shrink:0}
#exp-header span{color:#c8d8f0;font-weight:600;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#exp-counts{margin-left:auto;font-size:10px;color:#666;display:flex;gap:6px;flex-shrink:0}
#exp-filter-bar{padding:5px 8px;background:#141420;border-bottom:1px solid #1e1e2e;display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap}
#exp-filter-bar input{background:#1e1e2e;border:1px solid #333;color:#ddd;padding:3px 6px;font-size:11px;border-radius:4px;width:120px}
.filter-btn{background:#1e2e40;color:#7eb8f7;border:1px solid #336;font-size:10px;padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:#2a4a6a;border-color:#5a8fc0}
#exp-list{flex:1;overflow-y:auto;padding:3px 6px}
.exp-row{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:5px;margin-bottom:2px;border-left:3px solid transparent;cursor:pointer;font-size:11px;transition:background .1s}
.exp-row:hover{background:#1a1a28}
.exp-row.active{background:#1a2535;border-left-color:#4a80c0 !important}
.exp-row.human{border-left-color:#5dba7d}
.exp-row.auto-only{border-left-color:#7eb8f7}
.exp-row.none-ann{border-left-color:#333}
.exp-num{color:#555;width:24px;flex-shrink:0;text-align:right;font-size:10px}
.exp-name{flex:1;color:#b8c8e0;word-break:break-all;line-height:1.3;min-width:0}
.exp-name small{color:#555;font-size:9px;display:block}
.badge{font-size:9px;padding:1px 4px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.badge-sub{background:#1a3a1a;color:#5dba7d;border:1px solid #2a6a2a}
.badge-lock{background:#2a2200;color:#d4a017;border:1px solid #554400}
.badge-unassign{background:#1e1e1e;color:#555;border:1px solid #333}
.ann-tag{font-size:9px;white-space:nowrap;flex-shrink:0}
.ann-human{color:#5dba7d}.ann-auto{color:#7eb8f7}.ann-none{color:#444}
#empty-msg{display:flex;align-items:center;justify-content:center;flex:1;color:#444;font-size:13px}

/* review panel */
#review-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0e0e18}
#review-header{padding:8px 14px;background:#151525;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px;flex-shrink:0}
#review-title{font-size:13px;color:#c8d8f0;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#review-meta{font-size:11px;color:#666;white-space:nowrap}
.review-open-btn{font-size:10px;padding:2px 8px;background:#1a3050;color:#7eb8f7;border:1px solid #2a5080;border-radius:4px;text-decoration:none;white-space:nowrap;cursor:pointer}
.review-open-btn:hover{background:#1e4070}

#review-role-tabs{padding:5px 12px;border-bottom:1px solid #1e1e2e;display:flex;gap:6px;flex-shrink:0;background:#121220}
.rtab{font-size:10px;padding:2px 10px;border-radius:12px;cursor:pointer;border:1px solid #333;color:#777;transition:all .15s}
.rtab.active{border-color:#4a7fc1;color:#7eb8f7;background:#1a2a3a}

#review-body{flex:1;overflow-y:auto;padding:10px 12px}
#review-placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:#333;font-size:14px}

/* camera grid */
.cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cam-card{background:#151525;border-radius:6px;overflow:hidden;border:1px solid #222;transition:border-color .15s}
.cam-card:hover{border-color:#3a5070}
.cam-card-header{padding:5px 8px;background:#1a1a2e;display:flex;align-items:center;gap:6px;font-size:10px}
.cam-label{color:#7eb8f7;font-weight:600}
.cam-method{color:#555;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cam-badges{display:flex;gap:4px;flex-shrink:0}
.mbadge{font-size:8px;padding:1px 4px;border-radius:3px}
.mbadge-human{background:#1a3a1a;color:#5dba7d;border:1px solid #2a5a2a}
.mbadge-auto{background:#1a2a40;color:#7eb8f7;border:1px solid #2a4a70}
.mbadge-corrected{background:#2a1a3a;color:#b07ef7;border:1px solid #4a2a6a}

.cam-frames{display:flex;gap:6px;padding:6px;overflow-x:auto}
.frame-wrap{position:relative;flex-shrink:0;cursor:pointer}
.frame-wrap canvas{display:block;border-radius:3px;max-width:220px}
.frame-idx{position:absolute;top:3px;left:4px;font-size:9px;background:rgba(0,0,0,.65);color:#aaa;padding:1px 4px;border-radius:3px}

/* lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#lightbox.open{display:flex}
#lightbox-img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:4px}
#lightbox-caption{color:#888;font-size:11px}
#lightbox-close{position:absolute;top:14px;right:18px;color:#888;font-size:20px;cursor:pointer;background:none;border:none}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>
</head>
<body>

<header>
  <h1>实验浏览器</h1>
  <span class="hdr-sep">|</span>
  <div id="filter-bar">
    <label>分类</label>
    <select id="by-sel" onchange="loadGroups()">
      <option value="primary_tool">操作工具</option>
      <option value="task">任务类型</option>
      <option value="manipulated_object">操作对象</option>
      <option value="container">容器/辅助</option>
    </select>
    <label>数据集</label>
    <select id="prefix-sel" onchange="loadGroups()">
      <option value="">全部</option>
      <option value="videos_020">2月</option>
      <option value="videos_030">3月</option>
      <option value="videos_01">1月</option>
    </select>
  </div>
  <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
    <a href="/admin" style="color:#888;font-size:11px;text-decoration:none">管理员</a>
    <a href="/" style="color:#7eb8f7;font-size:12px;text-decoration:none">← 标注界面</a>
  </div>
</header>

<div id="main">

  <!-- left: group list -->
  <div id="group-panel">
    <div id="group-search">
      <input type="text" id="group-q" placeholder="搜索分组…" oninput="filterGroups()">
    </div>
    <div id="group-list"><div style="padding:8px;font-size:11px;color:#555">加载中…</div></div>
  </div>

  <!-- middle: exp list -->
  <div id="exp-panel">
    <div id="exp-header">
      <span id="exp-group-name">—</span>
      <div id="exp-counts"></div>
    </div>
    <div id="exp-filter-bar">
      <input type="text" id="exp-q" placeholder="搜索…" oninput="filterExps()">
      <button class="filter-btn active" onclick="setStatusFilter('all',this)">全部</button>
      <button class="filter-btn" onclick="setStatusFilter('human',this)">👤</button>
      <button class="filter-btn" onclick="setStatusFilter('auto',this)">🤖</button>
      <button class="filter-btn" onclick="setStatusFilter('none',this)">○</button>
    </div>
    <div id="exp-list"><div id="empty-msg">← 选择分组</div></div>
  </div>

  <!-- right: review panel -->
  <div id="review-panel">
    <div id="review-header">
      <span id="review-title" style="color:#444">点击实验查看标注</span>
      <span id="review-meta"></span>
      <a id="review-open-link" class="review-open-btn" style="display:none" target="_blank">打开标注</a>
    </div>
    <div id="review-role-tabs" style="display:none">
      <span class="rtab active" onclick="selectRole('primary_tool',this)">主工具</span>
      <span class="rtab" onclick="selectRole('auxiliary_tool',this)">辅助工具</span>
      <span class="rtab" onclick="selectRole('manipulated_object',this)">操作对象</span>
      <span class="rtab" onclick="selectRole('all',this)">全部</span>
    </div>
    <div id="review-body">
      <div id="review-placeholder">← 从中间列选择一个实验</div>
    </div>
  </div>

</div>

<!-- lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <canvas id="lightbox-img"></canvas>
  <div id="lightbox-caption"></div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let allGroups = [], allExps = [];
let currentBy = 'primary_tool', currentPrefix = '', currentGroup = null, statusFilter = 'all';
let reviewTaskId = null, reviewRole = 'primary_tool';
let reviewData = null;  // { cameras: { 'cam0_rgb': [objects...], ... } }
let reviewRow = null;   // the task row

// Role display names & colors
const ROLE_LABELS = { primary_tool: '主工具', auxiliary_tool: '辅助工具', manipulated_object: '操作对象' };
// Positive / negative point colors per role
const ROLE_COLORS = {
  primary_tool:       { pos: '#4af04a', neg: '#f04a4a' },
  auxiliary_tool:     { pos: '#4acdff', neg: '#ff8c4a' },
  manipulated_object: { pos: '#ffd04a', neg: '#f04acd' },
};
const DEFAULT_COLOR = { pos: '#ffffff', neg: '#888888' };

// ── Groups ──────────────────────────────────────────────────────────────────
async function loadGroups() {
  currentBy = document.getElementById('by-sel').value;
  currentPrefix = document.getElementById('prefix-sel').value;
  currentGroup = null; allExps = [];
  document.getElementById('group-list').innerHTML = '<div style="padding:8px;font-size:11px;color:#555">加载中…</div>';
  document.getElementById('exp-list').innerHTML = '<div id="empty-msg">← 选择分组</div>';
  document.getElementById('exp-group-name').textContent = '—';
  document.getElementById('exp-counts').innerHTML = '';
  const r = await fetch(`/api/browse/groups?by=${currentBy}&task_prefix=${enc(currentPrefix)}`);
  allGroups = (await r.json()).groups || [];
  renderGroups(allGroups);
}

function renderGroups(groups) {
  const el = document.getElementById('group-list');
  if (!groups.length) { el.innerHTML = '<div style="padding:8px;font-size:11px;color:#555">无数据</div>'; return; }
  el.innerHTML = groups.map(g => {
    const active = g.name === currentGroup ? ' active' : '';
    return `<div class="group-row${active}" onclick="selectGroup('${esc(g.name)}',this)">
      <div class="group-name">${esc(g.name)}</div>
      <div class="group-meta">
        <span class="g-total">${g.total}</span>
        ${g.submitted ? `<span class="g-sub">✓${g.submitted}</span>` : ''}
        ${g.locked    ? `<span class="g-lock">🔒${g.locked}</span>`    : ''}
        ${g.unassigned? `<span class="g-none">○${g.unassigned}</span>` : ''}
      </div></div>`;
  }).join('');
}

function filterGroups() {
  const q = document.getElementById('group-q').value.toLowerCase();
  renderGroups(q ? allGroups.filter(g => g.name.toLowerCase().includes(q)) : allGroups);
}

// ── Exps ────────────────────────────────────────────────────────────────────
async function selectGroup(name, rowEl) {
  document.querySelectorAll('.group-row').forEach(r => r.classList.remove('active'));
  rowEl.classList.add('active');
  currentGroup = name;
  document.getElementById('exp-group-name').textContent = name;
  document.getElementById('exp-list').innerHTML = '<div style="padding:10px;font-size:11px;color:#555">加载中…</div>';
  const r = await fetch(`/api/browse/exps?by=${currentBy}&name=${enc(name)}&task_prefix=${enc(currentPrefix)}`);
  allExps = (await r.json()).exps || [];
  renderExps(applyFilters(allExps));
  updateCounts(allExps);
}

function applyFilters(exps) {
  const q = document.getElementById('exp-q').value.toLowerCase();
  return exps.filter(e => {
    if (q && !e.exp.toLowerCase().includes(q)) return false;
    if (statusFilter === 'human' && e.human_cams === 0) return false;
    if (statusFilter === 'auto'  && e.auto_cams  === 0) return false;
    if (statusFilter === 'none'  && (e.human_cams > 0 || e.auto_cams > 0)) return false;
    return true;
  });
}

function numSuffix(s) { const m = s.match(/_(\d+)$/); return m ? parseInt(m[1]) : 0; }

function renderExps(exps) {
  const el = document.getElementById('exp-list');
  if (!exps.length) { el.innerHTML = '<div style="padding:10px;font-size:11px;color:#555">无匹配</div>'; return; }
  const sorted = [...exps].sort((a, b) => numSuffix(a.exp) - numSuffix(b.exp));
  el.innerHTML = sorted.map((e) => {
    const annClass = e.human_cams > 0 ? 'human' : e.auto_cams > 0 ? 'auto-only' : 'none-ann';
    const badgeCls = e.status === 'submitted' ? 'badge-sub' : e.status === 'locked' ? 'badge-lock' : 'badge-unassign';
    const badgeText = e.status === 'submitted' ? '✓' : e.status === 'locked' ? '🔒' : '○';
    const coreName = e.exp.replace(/^\d{8}_/,'').replace(/_\d+$/,'').replace(/_in_.+$/,'').replace(/_from_.+$/,'');
    const expNum = (e.exp.match(/_(\d+)$/) || [])[1] || '';
    return `<div class="exp-row ${annClass}" onclick="openReview(${e.id}, this, '${esc(e.exp)}', '${esc(e.task)}')">
      <span class="exp-num">#${expNum}</span>
      <span class="exp-name">${esc(coreName)}<small>${esc(e.task)}</small></span>
      <span class="badge ${badgeCls}">${badgeText}</span>
      <span class="ann-tag ${e.human_cams > 0 ? 'ann-human' : 'ann-none'}">👤${e.human_cams||'—'}</span>
      <span class="ann-tag ${e.auto_cams  > 0 ? 'ann-auto'  : 'ann-none'}">🤖${e.auto_cams||'—'}</span>
    </div>`;
  }).join('');
}

function updateCounts(exps) {
  const human = exps.filter(e => e.human_cams > 0).length;
  const auto  = exps.filter(e => e.auto_cams > 0 && e.human_cams === 0).length;
  const none  = exps.filter(e => e.human_cams === 0 && e.auto_cams === 0).length;
  document.getElementById('exp-counts').innerHTML =
    `<span style="color:#5dba7d">👤${human}</span><span style="color:#7eb8f7">🤖${auto}</span><span style="color:#555">○${none}</span>`;
}

function filterExps() { renderExps(applyFilters(allExps)); }
function setStatusFilter(val, btn) {
  statusFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterExps();
}

// ── Review ────────────────────────────────────────────────────────────────────
async function openReview(taskId, rowEl, expName, taskPath) {
  // Highlight selected row
  document.querySelectorAll('.exp-row').forEach(r => r.classList.remove('active'));
  rowEl.classList.add('active');

  reviewTaskId = taskId;
  reviewData = null;

  // Update header
  const coreName = expName.replace(/^\d{8}_/,'').replace(/_\d+$/,'').replace(/_in_.+$/,'').replace(/_from_.+$/,'');
  document.getElementById('review-title').textContent = coreName;
  document.getElementById('review-title').style.color = '#c8d8f0';
  const expNum = (expName.match(/_(\d+)$/) || [])[1] || '';
  document.getElementById('review-meta').textContent = `#${expNum} · ${taskPath}`;
  const link = document.getElementById('review-open-link');
  link.href = `/?open_task=${taskId}`;
  link.style.display = '';
  document.getElementById('review-role-tabs').style.display = 'flex';

  document.getElementById('review-body').innerHTML =
    '<div style="padding:20px;color:#555;font-size:12px">加载标注数据…</div>';

  // Fetch prompt data
  const r = await fetch(`/api/prompts/${taskId}`);
  const d = await r.json();
  reviewData = d;

  renderReview();
}

function selectRole(role, tabEl) {
  reviewRole = role;
  document.querySelectorAll('.rtab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  if (reviewData) renderReview();
}

function renderReview() {
  const cameras = reviewData.cameras || {};
  const camNames = Object.keys(cameras).sort();

  if (!camNames.length) {
    document.getElementById('review-body').innerHTML =
      '<div style="padding:20px;color:#555;font-size:12px">该实验暂无标注数据</div>';
    return;
  }

  const html = camNames.map(cam => renderCamCard(cam, cameras[cam])).join('');
  document.getElementById('review-body').innerHTML = `<div class="cam-grid">${html}</div>`;

  // Draw points on canvases after DOM is ready
  camNames.forEach(cam => drawCamFrames(cam, cameras[cam]));
}

function renderCamCard(cam, objects) {
  // Collect frames that have data for current role
  const frames = collectFrames(objects);
  if (!frames.length) return '';

  // Detect annotation types
  const hasCorrected = objects.some(o => (o.method||'').includes('depth_verify_corrected'));
  const hasHuman     = objects.some(o => !o.auto_generated);
  const hasAuto      = objects.some(o => o.auto_generated);

  const badges = [
    hasHuman     ? '<span class="mbadge mbadge-human">人工</span>' : '',
    hasAuto      ? '<span class="mbadge mbadge-auto">自动</span>'  : '',
    hasCorrected ? '<span class="mbadge mbadge-corrected">已修正</span>' : '',
  ].join('');

  // Methods summary
  const methods = [...new Set(objects.map(o => (o.method||'').split('+')[0]))].join('/');

  const frameHtml = frames.map(fi =>
    `<div class="frame-wrap" onclick="showLightbox('${cam}',${fi})">
      <canvas id="canvas-${cam}-${fi}" width="220" height="124"></canvas>
      <span class="frame-idx">kf${fi}</span>
    </div>`
  ).join('');

  return `<div class="cam-card">
    <div class="cam-card-header">
      <span class="cam-label">${cam}</span>
      <span class="cam-method">${esc(methods)}</span>
      <span class="cam-badges">${badges}</span>
    </div>
    <div class="cam-frames">${frameHtml}</div>
  </div>`;
}

function collectFrames(objects) {
  const roleFilter = reviewRole === 'all' ? null : reviewRole;
  const frameSet = new Set();
  for (const obj of objects) {
    if (roleFilter && obj.role !== roleFilter) continue;
    if ((obj.points||[]).length > 0) frameSet.add(obj.frame_index);
  }
  return [...frameSet].sort((a,b)=>a-b);
}

async function drawCamFrames(cam, objects) {
  const roleFilter = reviewRole === 'all' ? null : reviewRole;
  const frames = collectFrames(objects);

  for (const fi of frames) {
    const canvas = document.getElementById(`canvas-${cam}-${fi}`);
    if (!canvas) continue;
    const ctx = canvas.getContext('2d');

    // Load image
    const img = new Image();
    const taskId = reviewTaskId;
    const camNum = cam.replace('cam','').replace('_rgb','');
    img.src = `/api/image/${taskId}/${cam}/${fi}`;
    img.onload = () => {
      canvas.width = 220;
      canvas.height = Math.round(220 * img.naturalHeight / img.naturalWidth);
      const sx = canvas.width / img.naturalWidth;
      const sy = canvas.height / img.naturalHeight;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // Draw bbox + points for each matching object
      for (const obj of objects) {
        if (obj.frame_index !== fi) continue;
        if (roleFilter && obj.role !== roleFilter) continue;
        const colors = ROLE_COLORS[obj.role] || DEFAULT_COLOR;
        // bbox
        if (obj.bbox) {
          const [bx1,by1,bx2,by2] = obj.bbox;
          ctx.strokeStyle = colors.pos;
          ctx.lineWidth = 1.5;
          ctx.globalAlpha = 0.6;
          ctx.strokeRect(bx1*sx, by1*sy, (bx2-bx1)*sx, (by2-by1)*sy);
          ctx.globalAlpha = 1;
        }
        const pts = obj.points || [];
        const labels = obj.labels || [];
        pts.forEach(([x, y], i) => {
          const isPos = labels[i] === 1;
          const px = x * sx, py = y * sy;
          ctx.beginPath();
          ctx.arc(px, py, isPos ? 4 : 3, 0, Math.PI * 2);
          ctx.fillStyle = isPos ? colors.pos : colors.neg;
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.7)';
          ctx.lineWidth = 1;
          ctx.stroke();
          if (!isPos) {
            ctx.strokeStyle = colors.neg;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(px-3,py-3); ctx.lineTo(px+3,py+3); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px+3,py-3); ctx.lineTo(px-3,py+3); ctx.stroke();
          }
        });
      }
    };
  }
}

// ── Lightbox ─────────────────────────────────────────────────────────────────
function showLightbox(cam, frameIdx) {
  if (!reviewData || !reviewTaskId) return;
  const objects = (reviewData.cameras || {})[cam] || [];
  const roleFilter = reviewRole === 'all' ? null : reviewRole;

  const lb = document.getElementById('lightbox');
  const canvas = document.getElementById('lightbox-img');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const img = new Image();
  img.src = `/api/image/${reviewTaskId}/${cam}/${frameIdx}`;
  img.onload = () => {
    canvas.width  = Math.min(img.naturalWidth,  window.innerWidth  * 0.88);
    canvas.height = Math.round(canvas.width * img.naturalHeight / img.naturalWidth);
    const sx = canvas.width / img.naturalWidth;
    const sy = canvas.height / img.naturalHeight;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    // Draw bbox + points for all roles in lightbox
    for (const obj of objects) {
      if (obj.frame_index !== frameIdx) continue;
      if (roleFilter && obj.role !== roleFilter) continue;
      const colors = ROLE_COLORS[obj.role] || DEFAULT_COLOR;
      // bbox
      if (obj.bbox) {
        const [bx1,by1,bx2,by2] = obj.bbox;
        ctx.strokeStyle = colors.pos;
        ctx.lineWidth = 2.5;
        ctx.globalAlpha = 0.7;
        ctx.strokeRect(bx1*sx, by1*sy, (bx2-bx1)*sx, (by2-by1)*sy);
        ctx.globalAlpha = 1;
      }
      (obj.points||[]).forEach(([x,y], i) => {
        const isPos = (obj.labels||[])[i] === 1;
        const px = x*sx, py = y*sy;
        ctx.beginPath();
        ctx.arc(px, py, isPos ? 7 : 5, 0, Math.PI*2);
        ctx.fillStyle = isPos ? colors.pos : colors.neg;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (!isPos) {
          ctx.strokeStyle = colors.neg;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(px-5,py-5); ctx.lineTo(px+5,py+5); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(px+5,py-5); ctx.lineTo(px-5,py+5); ctx.stroke();
        }
      });
    }
  };

  document.getElementById('lightbox-caption').textContent = `${cam}  kf${frameIdx}`;
  lb.classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── Helpers ───────────────────────────────────────────────────────────────────
function enc(s) { return encodeURIComponent(s); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// init
loadGroups();
</script>
